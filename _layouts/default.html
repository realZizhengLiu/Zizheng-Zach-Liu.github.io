<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% if page.navbar_title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }} · {{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  {% if site.url != '' %}<link rel="canonical" href="{{ page.url | absolute_url }}"><meta property="og:url" content="{{ page.url | absolute_url }}">{% endif %}
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
  <script src="{{ '/assets/js/common.js' | relative_url }}" defer></script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":{{ site.data.profile.primary_name | jsonify }},"jobTitle":{{ site.data.profile.positions[0].name | jsonify }},"affiliation":{"@type":"CollegeOrUniversity","name":{{ site.data.profile.positions[2].name | jsonify }}},"email":{{ site.data.profile.email | jsonify }},"knowsAbout":[{% for area in site.data.research.areas %}{{ area.name | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include navbar.html %}
  <main id="main" class="site-main container" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
