short_bio: |-
  I am a Ph.D. candidate in Management Science and Engineering at the School of Economics and Management, Tsinghua University, advised by Professor Dengpan Liu.

  My research studies the **economics of digital platforms**, with a focus on digital advertising, the creator economy, and AI-enabled retailing. Using game-theoretic modeling, information design, and mechanism design, I examine how technological capabilities shape firms’ incentives, pricing, and information provision, and how their decisions affect competition and consumer welfare. My current projects investigate advertising attribution, built-in ad blockers, advertising assessments on LLM platforms, fan loyalty, algorithmic learning in retailing, and AI shopping assistants.
